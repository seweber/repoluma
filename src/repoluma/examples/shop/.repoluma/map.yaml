# repoluma map of the example shop. Authoring guide: `repoluma guide`.
schema_version: 2

repository:
  name: shop (example)
  description: A small fictional online shop. Customers buy products, pay through an external provider, receive shipments and may return them.

scope:
  summary: Checkout, payment, stock, shipping and returns. Everything in the repository is modeled; the HTTP API that the browser calls is referenced by the checkout form but not present in this repository.
  covered:
    - Placing an order, including declined payments and missing stock
    - Shipping and capturing payment
    - Returns and refunds
  not_covered:
    - The backend HTTP endpoint /api/orders (not in this repository)
    - Customer accounts and e-mail addresses (email_for is injected by the caller)

nodes:
  # ---------------------------------------------------------------- purchasing
  - id: purchasing
    kind: capability
    label: Purchasing
    summary: Customers turn a cart into a confirmed order with stock held and funds authorized.

  - id: checkout-form
    parent: purchasing
    kind: component
    label: Checkout form (browser)
    summary: Collects a payment token from the provider widget and submits the cart.
    evidence: observed
    refs:
      - path: web/checkout.ts
        symbol: submitCheckout
    notes: Posts to /api/orders, which is not part of this repository.

  - id: place-order
    parent: purchasing
    kind: responsibility
    label: Place an order
    summary: Validates the cart, reserves stock, authorizes payment, then confirms and announces the order.
    details: All-or-nothing. A declined payment releases the stock reservation so nothing stays held.
    contract:
      inputs:
        - customer id
        - cart lines (sku -> quantity), 1 to 50 lines, positive quantities
        - payment token from the provider widget
      outputs:
        - Order in status "confirmed" with reservation and authorization attached
        - event order.confirmed
      guarantees:
        - On success, stock is reserved and funds are authorized (not captured)
        - On failure, no reservation remains
      errors:
        - CheckoutError for invalid carts, missing stock, or declined payment
    evidence: observed
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
      - path: tests/test_orders.py
        symbol: test_declined_payment_releases_reservation
        role: test

  - id: pricing
    parent: purchasing
    kind: responsibility
    label: Price the cart
    summary: Sums catalog prices in integer cents; inactive products cannot be bought.
    evidence: observed
    refs:
      - path: shop/orders.py
        symbol: OrderService.price
      - path: shop/catalog.py
        symbol: Catalog.get
      - path: shop/money.py
        symbol: Money

  - id: cart-limits
    parent: purchasing
    kind: rule
    label: Cart limits
    summary: An order has 1 to 50 lines and every quantity is positive.
    evidence: observed
    refs:
      - path: shop/orders.py
        symbol: MAX_LINES_PER_ORDER

  # ------------------------------------------------------------------ payments
  - id: payments
    kind: capability
    label: Payments
    summary: Holds, collects and returns customer money through an external payment provider.

  - id: authorize-payment
    parent: payments
    kind: contract
    label: Authorize payment
    summary: Hold funds for an order without collecting them.
    contract:
      inputs:
        - payment token
        - positive amount in cents and currency
      outputs:
        - Authorization (provider id + amount)
      guarantees:
        - Never captures money
      errors:
        - PaymentDeclined with the provider's reason
        - ValueError for non-positive amounts
      assumptions:
        - The provider answers synchronously with status "approved" or a reason
    evidence: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.authorize

  - id: capture-payment
    parent: payments
    kind: responsibility
    label: Capture payment
    summary: Collect previously authorized funds when the order ships.
    evidence: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.capture

  - id: refund-payment
    parent: payments
    kind: responsibility
    label: Refund payment
    summary: Return money to the original payment, never more than was authorized.
    evidence: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.refund

  - id: provider-port
    parent: payments
    kind: contract
    label: Payment provider interface
    summary: The three provider calls the shop depends on.
    contract:
      inputs: [authorize(token, amount, currency), capture(authorization id), refund(authorization id, amount)]
      outputs: [dict responses; authorize returns status, id and optional reason]
      assumptions: [Calls are synchronous and idempotency is not handled here]
    evidence: observed
    refs:
      - path: shop/payments.py
        symbol: ProviderClient

  # --------------------------------------------------------------------- stock
  - id: stock
    kind: capability
    label: Stock
    summary: Knows what is on hand and holds goods for confirmed orders.

  - id: reserve-stock
    parent: stock
    kind: responsibility
    label: Reserve stock
    summary: Holds all requested lines or none.
    evidence: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve

  - id: release-stock
    parent: stock
    kind: responsibility
    label: Release reservation
    summary: Gives held stock back when an order fails.
    evidence: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.release

  - id: commit-stock
    parent: stock
    kind: responsibility
    label: Commit stock on shipment
    summary: Converts a reservation into a stock decrement.
    evidence: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.commit

  - id: no-partial-reservations
    parent: stock
    kind: rule
    label: No partial reservations
    summary: If any line lacks stock, nothing is reserved.
    evidence: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
      - path: tests/test_orders.py
        symbol: test_out_of_stock_is_rejected
        role: test

  - id: inventory-store
    parent: stock
    kind: resource
    label: Inventory levels
    summary: In-memory on-hand and reserved counts per SKU.
    evidence: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory

  # --------------------------------------------------------------- fulfillment
  - id: fulfillment
    kind: capability
    label: Fulfillment
    summary: Ships confirmed orders and collects payment at that moment.

  - id: ship-order
    parent: fulfillment
    kind: responsibility
    label: Ship an order
    summary: Commits stock, captures payment and publishes order.shipped.
    details: Capture happens only here, so customers are charged when goods leave.
    evidence: observed
    refs:
      - path: shop/fulfillment.py
        symbol: Fulfillment.ship

  # ------------------------------------------------------------------- returns
  - id: returns
    kind: capability
    label: Returns
    summary: Takes back shipped goods within 30 days and refunds the full order.

  - id: accept-return
    parent: returns
    kind: responsibility
    label: Accept a return
    summary: Restocks the goods and refunds the order total.
    evidence: observed
    refs:
      - path: shop/returns.py
        symbol: accept_return

  - id: return-window
    parent: returns
    kind: rule
    label: 30-day return window
    summary: Returns are rejected more than 30 days after delivery.
    evidence: observed
    refs:
      - path: shop/returns.py
        symbol: RETURN_WINDOW
      - path: README.md
        symbol: Returns
        role: docs

  - id: partial-returns
    parent: returns
    kind: rule
    label: Partial returns
    summary: Not supported; only whole orders can be returned. Unclear whether this is intended.
    evidence: needs_review

  # ------------------------------------------------------- customer messaging
  - id: messaging
    kind: capability
    label: Customer messaging
    summary: Tells customers what happened to their order.

  - id: order-emails
    parent: messaging
    kind: responsibility
    label: Order e-mails
    summary: Sends a confirmation e-mail; shipment e-mails are not implemented yet.
    evidence: observed
    refs:
      - path: shop/notifications.py
        symbol: register

  - id: event-bus
    parent: messaging
    kind: resource
    label: Order events
    summary: In-process publish/subscribe for order.confirmed and order.shipped.
    evidence: observed
    refs:
      - path: shop/events.py
        symbol: EventBus

  # ------------------------------------------------------------------ outside
  - id: payment-provider
    kind: external
    label: Payment provider
    summary: Third-party service that authorizes, captures and refunds card payments.
    evidence: inferred

  - id: customer
    kind: actor
    label: Customer
    summary: Buys products and may return them.

relationships:
  # data: from = where the data comes from, to = where it goes; label = the data
  - {id: customer-checks-out, from: customer, to: checkout-form, type: data, label: cart and payment token}
  - {id: customer-returns, from: customer, to: accept-return, type: data, label: returned order, evidence: inferred}
  - id: form-submits-order
    from: checkout-form
    to: place-order
    type: data
    label: order request (POST /api/orders)
    evidence: needs_review
    notes: The HTTP handler between these is not in the repository.
  - {id: order-prices, from: pricing, to: place-order, type: data, label: order total, evidence: observed}
  - {id: order-reserves, from: place-order, to: reserve-stock, type: data, label: order lines, evidence: observed}
  - {id: order-authorizes, from: place-order, to: authorize-payment, type: data, label: payment token and total, evidence: observed}
  - {id: authorization-returned, from: authorize-payment, to: place-order, type: data, label: authorization, evidence: observed}
  - {id: order-releases, from: place-order, to: release-stock, type: data, label: reservation (on decline), evidence: observed}
  - {id: order-publishes, from: place-order, to: event-bus, type: data, kind: event, label: order.confirmed, evidence: observed}
  - {id: auth-uses-provider, from: authorize-payment, to: provider-port, type: data, label: token and amount, evidence: observed}
  - {id: capture-uses-provider, from: capture-payment, to: provider-port, type: data, label: authorization id, evidence: observed}
  - {id: refund-uses-provider, from: refund-payment, to: provider-port, type: data, label: authorization id and amount, evidence: observed}
  - {id: reserve-writes, from: reserve-stock, to: inventory-store, type: data, label: reserved quantities, evidence: observed}
  - {id: release-writes, from: release-stock, to: inventory-store, type: data, label: released quantities, evidence: observed}
  - {id: commit-writes, from: commit-stock, to: inventory-store, type: data, label: shipped quantities, evidence: observed}
  - {id: ship-commits, from: ship-order, to: commit-stock, type: data, label: reservation, evidence: observed}
  - {id: ship-captures, from: ship-order, to: capture-payment, type: data, label: authorization, evidence: observed}
  - {id: ship-publishes, from: ship-order, to: event-bus, type: data, kind: event, label: order.shipped, evidence: observed}
  - {id: return-restocks, from: accept-return, to: inventory-store, type: data, label: returned quantities, evidence: observed}
  - {id: return-refunds, from: accept-return, to: refund-payment, type: data, label: authorization and order total, evidence: observed}
  - {id: emails-subscribe, from: event-bus, to: order-emails, type: data, kind: event, label: order.confirmed, evidence: observed}
  - {id: emails-to-customer, from: order-emails, to: customer, type: data, label: confirmation e-mail, evidence: observed}
  # dependency: from relies on, implements or is constrained by to
  - {id: order-enforces-limits, from: place-order, to: cart-limits, type: dependency, kind: enforces, evidence: observed}
  - {id: provider-implements-port, from: payment-provider, to: provider-port, type: dependency, kind: implements, evidence: inferred, notes: No adapter exists in this repository; tests use a fake.}
  - {id: reserve-enforces, from: reserve-stock, to: no-partial-reservations, type: dependency, kind: enforces, evidence: observed}
  - {id: return-enforces-window, from: accept-return, to: return-window, type: dependency, kind: enforces, evidence: observed}

flows:
  - id: flow-place-order
    label: Place an order
    summary: From checkout form to confirmed order, including the declined-payment path.
    evidence: observed
    steps:
      - {id: submit, node: checkout-form, label: Customer submits cart and payment token, via: form-submits-order}
      - {id: validate, node: cart-limits, label: Check line count and quantities, via: order-enforces-limits}
      - {id: price, node: pricing, label: Price the cart from the catalog, via: order-prices}
      - {id: reserve, node: reserve-stock, label: Reserve every line or fail, via: order-reserves}
      - {id: out-of-stock, node: place-order, kind: failure, after: reserve, label: "Out of stock: CheckoutError, nothing held"}
      - {id: authorize, node: authorize-payment, label: Ask provider to hold funds, via: order-authorizes}
      - {id: declined, node: release-stock, kind: compensation, after: authorize, label: "Declined: release reservation, CheckoutError", via: order-releases}
      - {id: confirm, node: event-bus, label: Order confirmed and announced, via: order-publishes}
      - {id: email, node: order-emails, label: Confirmation e-mail sent, via: emails-subscribe}

  - id: flow-ship-and-return
    label: Ship, then return
    summary: What happens to stock and money after confirmation.
    evidence: observed
    steps:
      - {id: ship, node: ship-order, label: Warehouse ships the order}
      - {id: commit, node: commit-stock, label: Reserved stock leaves on-hand, via: ship-commits}
      - {id: capture, node: capture-payment, label: Funds are collected, via: ship-captures}
      - {id: return, node: accept-return, label: Customer returns within 30 days, via: customer-returns}
      - {id: too-late, node: return-window, kind: failure, after: return, label: "After 30 days: ReturnRejected"}
      - {id: refund, node: refund-payment, label: Full refund to original payment, via: return-refunds}
