# repoluma map of the example shop. Authoring guide: `repoluma guide`.
schema_version: 3

repository:
  name: shop (example)
  description: A small fictional online shop. Customers buy products, pay through an external provider, receive shipments and may return them.

scope:
  summary: Checkout, payment, stock, shipping and returns. Everything in the repository is modeled; the HTTP API that the browser calls is referenced by the checkout form but not present in this repository.
  covered:
    - Placing an order, including declined payments and missing stock
    - Shipping and capturing payment
    - Returns and refunds
  not_covered:
    - The backend HTTP endpoint /api/orders (not in this repository)
    - Customer accounts and e-mail addresses (email_for is injected by the caller)

nodes:
  # ---------------------------------------------------------------- purchasing
  - id: purchasing
    kind: capability
    label: Ordering
    summary: Customers turn a cart into a confirmed order with stock held and funds authorized.
    owns:
      - web/checkout.ts
      - shop/orders.py
      - shop/catalog.py

  - id: checkout-form
    parent: purchasing
    kind: component
    label: Checkout form
    summary: Collects a payment token from the provider widget and submits the cart.
    certainty: observed
    refs:
      - path: web/checkout.ts
        symbol: submitCheckout
      - path: web/checkout.ts
        symbol: CartLine
    notes: Posts to /api/orders, which is not part of this repository.

  - id: place-order
    parent: purchasing
    kind: responsibility
    label: Place order
    summary: Validates the cart, reserves stock, authorizes payment, then confirms and announces the order.
    details: All-or-nothing. A declined payment releases the stock reservation so nothing stays held.
    contract:
      inputs:
        - customer id
        - cart lines (sku -> quantity), 1 to 50 lines, positive quantities
        - payment token from the provider widget
      outputs:
        - Order in status "confirmed" with reservation and authorization attached
        - event order.confirmed
      guarantees:
        - On success, stock is reserved and funds are authorized (not captured)
        - On failure, no reservation remains
      errors:
        - CheckoutError for invalid carts, missing stock, or declined payment
    certainty: observed
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
      - path: tests/test_orders.py
        symbol: test_declined_payment_releases_reservation
        role: test
      - path: shop/orders.py
        symbol: CheckoutError
      - path: shop/orders.py
        symbol: Order
      - path: shop/orders.py
        symbol: OrderService.__init__

  - id: pricing
    parent: purchasing
    kind: responsibility
    label: Price the cart
    summary: Sums catalog prices in integer cents; inactive products cannot be bought.
    certainty: observed
    refs:
      - path: shop/orders.py
        symbol: OrderService.price
      - path: shop/catalog.py
        symbol: Catalog.get
      - path: shop/money.py
        symbol: Money
      - path: shop/catalog.py
        symbol: Product
      - path: shop/catalog.py
        symbol: Catalog.__init__

  - id: cart-limits
    parent: purchasing
    kind: rule
    label: Max 50 lines per cart
    summary: An order has 1 to 50 lines and every quantity is positive.
    certainty: observed
    refs:
      - path: shop/orders.py
        symbol: MAX_LINES_PER_ORDER

  # ------------------------------------------------------------------ payments
  - id: payments
    kind: capability
    label: Payments
    summary: Holds, collects and returns customer money through an external payment provider.
    owns:
      - shop/payments.py

  - id: authorize-payment
    parent: payments
    kind: contract
    label: Payment authorization
    summary: Hold funds for an order without collecting them.
    contract:
      inputs:
        - payment token
        - positive amount in cents and currency
      outputs:
        - Authorization (provider id + amount)
      guarantees:
        - Never captures money
      errors:
        - PaymentDeclined with the provider's reason
        - ValueError for non-positive amounts
      assumptions:
        - The provider answers synchronously with status "approved" or a reason
    certainty: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.authorize
      - path: shop/payments.py
        symbol: PaymentDeclined
      - path: shop/payments.py
        symbol: Authorization
      - path: shop/payments.py
        symbol: PaymentService.__init__

  - id: capture-payment
    parent: payments
    kind: responsibility
    label: Capture payment
    summary: Collect previously authorized funds when the order ships.
    certainty: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.capture

  - id: refund-payment
    parent: payments
    kind: responsibility
    label: Refund payment
    summary: Return money to the original payment, never more than was authorized.
    certainty: observed
    refs:
      - path: shop/payments.py
        symbol: PaymentService.refund

  - id: provider-port
    parent: payments
    kind: contract
    label: Payment provider interface
    summary: The three provider calls the shop depends on.
    contract:
      inputs: [authorize(token, amount, currency), capture(authorization id), refund(authorization id, amount)]
      outputs: [dict responses; authorize returns status, id and optional reason]
      assumptions: [Calls are synchronous and idempotency is not handled here]
    certainty: observed
    refs:
      - path: shop/payments.py
        symbol: ProviderClient

  # --------------------------------------------------------------------- stock
  - id: stock
    kind: capability
    label: Inventory
    summary: Knows what is on hand and holds goods for confirmed orders.
    owns:
      - shop/inventory.py

  - id: reserve-stock
    parent: stock
    kind: responsibility
    label: Reserve stock
    summary: Holds all requested lines or none.
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
      - path: shop/inventory.py
        symbol: OutOfStock
      - path: shop/inventory.py
        symbol: Reservation

  - id: release-stock
    parent: stock
    kind: responsibility
    label: Release reserved stock
    summary: Gives held stock back when an order fails.
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.release

  - id: commit-stock
    parent: stock
    kind: responsibility
    label: Deduct shipped stock
    summary: Converts a reservation into a stock decrement.
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.commit

  - id: no-partial-reservations
    parent: stock
    kind: rule
    label: All lines reserved or none
    summary: If any line lacks stock, nothing is reserved.
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
      - path: tests/test_orders.py
        symbol: test_out_of_stock_is_rejected
        role: test

  - id: inventory-store
    parent: stock
    kind: resource
    label: Stock levels
    summary: In-memory on-hand and reserved counts per SKU.
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory
        note: the counts themselves (fields on_hand and reserved)
      - path: shop/inventory.py
        symbol: Inventory.available
      - path: shop/inventory.py
        symbol: Inventory.restock

  # --------------------------------------------------------------- fulfillment
  - id: fulfillment
    kind: capability
    label: Shipping
    summary: Ships confirmed orders and collects payment at that moment.
    owns:
      - shop/fulfillment.py

  - id: ship-order
    parent: fulfillment
    kind: responsibility
    label: Ship order
    summary: Commits stock, captures payment and publishes order.shipped.
    details: Capture happens only here, so customers are charged when goods leave.
    certainty: observed
    refs:
      - path: shop/fulfillment.py
        symbol: Fulfillment.ship
      - path: shop/fulfillment.py
        symbol: Fulfillment.__init__

  # ------------------------------------------------------------------- returns
  - id: returns
    kind: capability
    label: Returns
    summary: Takes back shipped goods within 30 days and refunds the full order.
    owns:
      - shop/returns.py

  - id: accept-return
    parent: returns
    kind: responsibility
    label: Accept returned order
    summary: Restocks the goods and refunds the order total.
    certainty: observed
    refs:
      - path: shop/returns.py
        symbol: accept_return

  - id: return-window
    parent: returns
    kind: rule
    label: No returns after 30 days
    summary: Returns are rejected more than 30 days after delivery.
    certainty: observed
    refs:
      - path: shop/returns.py
        symbol: RETURN_WINDOW
      - path: README.md
        symbol: Returns
        role: docs
      - path: shop/returns.py
        symbol: ReturnRejected

  - id: partial-returns
    parent: returns
    kind: rule
    label: Whole-order returns only
    summary: Not supported; only whole orders can be returned. Unclear whether this is intended.
    certainty: needs_review

  # ------------------------------------------------------- customer messaging
  - id: messaging
    kind: capability
    label: Customer notifications
    summary: Tells customers what happened to their order.
    owns:
      - shop/notifications.py
      - shop/events.py

  - id: order-emails
    parent: messaging
    kind: responsibility
    label: Send order e-mails
    summary: Sends a confirmation e-mail; shipment e-mails are not implemented yet.
    certainty: observed
    refs:
      - path: shop/notifications.py
        symbol: register
      - path: shop/notifications.py
        symbol: Mailer

  - id: event-bus
    parent: messaging
    kind: resource
    label: Order event bus
    summary: In-process publish/subscribe for order.confirmed and order.shipped.
    certainty: observed
    refs:
      - path: shop/events.py
        symbol: EventBus

  # -------------------------------------------------------------------- shared
  - id: shared
    kind: area
    label: Shared value types
    summary: Small pieces every area uses; they make no business decisions of their own.
    owns:
      - shop/__init__.py
      - shop/money.py

  - id: money
    parent: shared
    kind: data
    label: Money amounts
    summary: Amounts in integer cents with a currency; adding different currencies is an error.
    certainty: observed
    refs:
      - path: shop/money.py
        symbol: Money

  # ------------------------------------------------------------------ outside
  - id: payment-provider
    kind: external
    label: Payment provider
    summary: Third-party service that authorizes, captures and refunds card payments.
    certainty: inferred

  - id: customer
    kind: actor
    label: Customer
    summary: Buys products and may return them.

relationships:
  # Data goes from `from` to `to`, labelled with the data. A call and what comes back share an
  # `exchange`: one `input` leg and its `result` / `error` legs. Each data line cites where the
  # data is handed over (`transfer`) or taken in (`receive`), with `focus` on the exact text.

  # ------------------------------------------------------------ checkout (browser)
  - id: customer-checks-out
    from: customer
    to: checkout-form
    type: data
    label: cart and payment token
    certainty: inferred
    notes: The page that calls submitCheckout is not in this repository; the parameters show what it receives.
    refs:
      - path: web/checkout.ts
        symbol: submitCheckout
        role: receive
        focus: "submitCheckout(lines: CartLine[], paymentToken: string)"

  - id: form-submits-order
    from: checkout-form
    to: place-order
    type: data
    label: order request (POST /api/orders)
    certainty: needs_review
    exchange: checkout-request
    leg: input
    notes: The HTTP handler between the form and place_order is not in this repository, so it is not known how the request becomes the arguments of place_order.
    refs:
      - path: web/checkout.ts
        symbol: submitCheckout
        role: transfer
        focus: "body: JSON.stringify({ lines, paymentToken })"

  - id: order-id-returned
    from: place-order
    to: checkout-form
    type: data
    label: order id (402 if declined)
    certainty: needs_review
    exchange: checkout-request
    leg: result
    notes: The form reads orderId and treats status 402 as a declined payment; the handler that would turn the Order or CheckoutError into that response is not in this repository.
    refs:
      - path: web/checkout.ts
        symbol: submitCheckout
        role: receive
        focus: [response.status === 402, return body.orderId;]

  # ------------------------------------------------------------------ ordering
  - id: order-sends-lines
    from: place-order
    to: pricing
    type: data
    label: cart lines
    certainty: observed
    exchange: price-cart
    leg: input
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: transfer
        focus: total = self.price(lines)

  - id: order-prices
    from: pricing
    to: place-order
    type: data
    label: order total
    certainty: observed
    exchange: price-cart
    leg: result
    refs:
      - path: shop/orders.py
        symbol: OrderService.price
        role: origin
        focus: total = total + self.catalog.get(sku).price.times(qty)
      - path: shop/orders.py
        symbol: OrderService.price
        role: transfer
        focus: return total
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: receive
        focus: total = self.price(lines)

  - id: order-reserves
    from: place-order
    to: reserve-stock
    type: data
    label: order lines
    certainty: observed
    exchange: reserve-lines
    leg: input
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: transfer
        focus: reservation = self.inventory.reserve(lines)

  - id: reservation-returned
    from: reserve-stock
    to: place-order
    type: data
    label: reservation
    certainty: observed
    exchange: reserve-lines
    leg: result
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
        role: transfer
        focus: return Reservation(id=str(uuid.uuid4()), lines=dict(lines))
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: receive
        focus: reservation = self.inventory.reserve(lines)

  - id: stock-shortage
    from: reserve-stock
    to: place-order
    type: error
    label: out of stock (SKU)
    certainty: observed
    exchange: reserve-lines
    leg: error
    summary: Nothing has been reserved when this is raised; place_order turns it into a CheckoutError.
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
        role: transfer
        focus: raise OutOfStock(sku)
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: receive
        focus: [except OutOfStock as exc, 'raise CheckoutError(f"out of stock: {exc}") from exc']

  - id: order-authorizes
    from: place-order
    to: authorize-payment
    type: data
    label: payment token and total
    certainty: observed
    exchange: payment-authorization
    leg: input
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: transfer
        focus: self.payments.authorize(payment_token, total)
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: origin
        note: the token is a parameter of place_order (from the caller); the total comes from pricing
        focus: ["payment_token: str", total = self.price(lines)]
      - path: shop/payments.py
        symbol: PaymentService.authorize
        role: receive
        focus: "def authorize(self, payment_token: str, amount: Money) -> Authorization:"

  - id: authorization-returned
    from: authorize-payment
    to: place-order
    type: data
    label: authorization
    certainty: observed
    exchange: payment-authorization
    leg: result
    refs:
      - path: shop/payments.py
        symbol: PaymentService.authorize
        role: transfer
        focus: 'return Authorization(id=response["id"], amount=amount)'
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: receive
        focus: authorization = self.payments.authorize
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: origin
        note: kept on the confirmed order, where shipping and returns find it later
        focus: '"confirmed", reservation, authorization,'

  - id: payment-declined
    from: authorize-payment
    to: place-order
    type: error
    label: decline reason
    certainty: observed
    exchange: payment-authorization
    leg: error
    summary: Raised instead of a result when the provider does not approve; no authorization exists on this path.
    refs:
      - path: shop/payments.py
        symbol: PaymentService.authorize
        role: transfer
        focus: 'raise PaymentDeclined(response.get("reason", "declined"))'
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: receive
        focus: except PaymentDeclined as exc

  - id: order-releases
    from: place-order
    to: release-stock
    type: data
    label: reservation (on decline)
    certainty: observed
    summary: Only on the declined path, so that nothing stays held; the caller then gets a CheckoutError.
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: transfer
        focus: self.inventory.release(reservation)
      - path: shop/inventory.py
        symbol: Inventory.release
        role: receive
        focus: "def release(self, reservation: Reservation) -> None:"

  - id: order-publishes
    from: place-order
    to: event-bus
    type: data
    kind: event
    label: order.confirmed
    certainty: observed
    summary: Published after the order is stored; nothing comes back to the publisher.
    refs:
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: transfer
        focus: 'self.bus.publish("order.confirmed", {"order_id": order.id, "customer": customer})'
      - path: shop/events.py
        symbol: EventBus.publish
        role: receive
        focus: "def publish(self, topic: str, payload: dict) -> None:"

  # ------------------------------------------------------------------ payments
  - id: auth-uses-provider
    from: authorize-payment
    to: provider-port
    type: data
    label: token and amount
    certainty: observed
    exchange: provider-authorize
    leg: input
    refs:
      - path: shop/payments.py
        symbol: PaymentService.authorize
        role: transfer
        focus: response = self.provider.authorize(payment_token, amount.cents, amount.currency)

  - id: provider-answers
    from: provider-port
    to: authorize-payment
    type: data
    label: provider response (status, id, reason)
    certainty: observed
    exchange: provider-authorize
    leg: result
    notes: Only the receiving side is in this repository; the provider's adapter that builds the response is not (tests use a fake).
    refs:
      - path: shop/payments.py
        symbol: ProviderClient.authorize
        role: origin
        note: the interface only promises a dict
        focus: "def authorize(self, token: str, amount_cents: int, currency: str) -> dict: ..."
      - path: shop/payments.py
        symbol: PaymentService.authorize
        role: receive
        focus: [response = self.provider.authorize, 'response.get("status") != "approved"']

  - id: capture-uses-provider
    from: capture-payment
    to: provider-port
    type: data
    label: authorization id
    certainty: observed
    summary: The provider's answer is ignored.
    refs:
      - path: shop/payments.py
        symbol: PaymentService.capture
        role: transfer
        focus: self.provider.capture(authorization.id)

  - id: refund-uses-provider
    from: refund-payment
    to: provider-port
    type: data
    label: authorization id and amount
    certainty: observed
    summary: Only after checking that the amount does not exceed what was authorized; the answer is ignored.
    refs:
      - path: shop/payments.py
        symbol: PaymentService.refund
        role: transfer
        focus: self.provider.refund(authorization.id, amount.cents)

  # --------------------------------------------------------------------- stock
  - id: stock-available
    from: inventory-store
    to: reserve-stock
    type: data
    label: available quantities
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.available
        role: origin
        focus: return self.on_hand.get(sku, 0) - self.reserved.get(sku, 0)
      - path: shop/inventory.py
        symbol: Inventory.reserve
        role: receive
        focus: "if self.available(sku) < qty:"

  - id: reserve-writes
    from: reserve-stock
    to: inventory-store
    type: data
    label: reserved quantities
    certainty: observed
    summary: Written only after every line was checked, so a shortage leaves the counts untouched.
    refs:
      - path: shop/inventory.py
        symbol: Inventory.reserve
        role: transfer
        focus: self.reserved[sku] = self.reserved.get(sku, 0) + qty

  - id: release-writes
    from: release-stock
    to: inventory-store
    type: data
    label: released quantities
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.release
        role: transfer
        focus: self.reserved[sku] -= qty

  - id: commit-writes
    from: commit-stock
    to: inventory-store
    type: data
    label: shipped quantities
    certainty: observed
    refs:
      - path: shop/inventory.py
        symbol: Inventory.commit
        role: transfer
        focus: ['self.reserved[sku] -= qty', 'self.on_hand[sku] -= qty']

  # --------------------------------------------------------------- fulfillment
  - id: ship-commits
    from: ship-order
    to: commit-stock
    type: data
    label: reservation
    certainty: observed
    refs:
      - path: shop/fulfillment.py
        symbol: Fulfillment.ship
        role: transfer
        focus: self.inventory.commit(order.reservation)
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: origin
        note: the reservation was attached to the order when it was confirmed
        focus: '"confirmed", reservation, authorization,'

  - id: ship-captures
    from: ship-order
    to: capture-payment
    type: data
    label: authorization
    certainty: observed
    refs:
      - path: shop/fulfillment.py
        symbol: Fulfillment.ship
        role: transfer
        focus: self.payments.capture(order.authorization)
      - path: shop/orders.py
        symbol: OrderService.place_order
        role: origin
        note: the authorization was attached to the order when it was confirmed
        focus: '"confirmed", reservation, authorization,'

  - id: ship-publishes
    from: ship-order
    to: event-bus
    type: data
    kind: event
    label: order.shipped
    certainty: observed
    summary: Published after stock and payment are settled. Its subscriber does nothing yet (see Send order e-mails).
    refs:
      - path: shop/fulfillment.py
        symbol: Fulfillment.ship
        role: transfer
        focus: 'self.bus.publish("order.shipped", {"order_id": order.id, "tracking": tracking_code})'

  # ------------------------------------------------------------------- returns
  - id: return-restocks
    from: accept-return
    to: inventory-store
    type: data
    label: returned quantities
    certainty: observed
    refs:
      - path: shop/returns.py
        symbol: accept_return
        role: transfer
        focus: inventory.restock(sku, qty)
      - path: shop/inventory.py
        symbol: Inventory.restock
        role: receive
        focus: self.on_hand[sku] = self.on_hand.get(sku, 0) + qty

  - id: return-refunds
    from: accept-return
    to: refund-payment
    type: data
    label: authorization and order total
    certainty: observed
    refs:
      - path: shop/returns.py
        symbol: accept_return
        role: transfer
        focus: payments.refund(order.authorization, order.total)
      - path: shop/payments.py
        symbol: PaymentService.refund
        role: receive
        focus: "def refund(self, authorization: Authorization, amount: Money) -> None:"

  # ------------------------------------------------------- customer messaging
  - id: emails-subscribe
    from: event-bus
    to: order-emails
    type: data
    kind: event
    label: order.confirmed
    certainty: observed
    refs:
      - path: shop/events.py
        symbol: EventBus.publish
        role: transfer
        focus: handler(payload)
      - path: shop/notifications.py
        symbol: register
        role: receive
        note: the subscription routes this topic to the handler
        focus: ['bus.subscribe("order.confirmed", on_confirmed)', "def on_confirmed(event: dict) -> None:"]

  - id: emails-to-customer
    from: order-emails
    to: customer
    type: data
    label: confirmation e-mail
    certainty: inferred
    notes: The Mailer only records the message in an in-memory outbox; how it reaches the customer is not in this repository.
    refs:
      - path: shop/notifications.py
        symbol: register
        role: transfer
        focus: 'mailer.send(email_for(event["customer"]), "Your order is confirmed")'
      - path: shop/notifications.py
        symbol: Mailer.send
        role: receive
        focus: self.outbox.append((to, subject))

  - id: customer-returns
    from: customer
    to: accept-return
    type: data
    label: returned order
    certainty: inferred
    notes: No caller of accept_return is in this repository (no return form or endpoint).

  # ------------------------------------------------------------- dependencies
  # from relies on, implements or is constrained by to
  - {id: order-enforces-limits, from: place-order, to: cart-limits, type: dependency, kind: enforces, certainty: observed}
  - {id: provider-implements-port, from: payment-provider, to: provider-port, type: dependency, kind: implements, certainty: inferred, notes: No adapter exists in this repository; tests use a fake.}
  - {id: reserve-enforces, from: reserve-stock, to: no-partial-reservations, type: dependency, kind: enforces, certainty: observed}
  - {id: return-enforces-window, from: accept-return, to: return-window, type: dependency, kind: enforces, certainty: observed}

flows:
  - id: flow-place-order
    label: Place an order
    summary: From checkout form to confirmed order, including missing stock and the declined-payment path.
    certainty: observed
    steps:
      - {id: submit, node: checkout-form, label: Customer submits cart and payment token, via: form-submits-order}
      - {id: validate, node: cart-limits, label: Check line count and quantities, via: order-enforces-limits}
      - {id: price, node: pricing, label: Price the cart from the catalog, via: order-sends-lines}
      - {id: total, node: place-order, label: The order total comes back, via: order-prices}
      - {id: reserve, node: reserve-stock, label: Reserve every line or fail, via: order-reserves}
      - {id: out-of-stock, node: place-order, kind: failure, after: reserve, label: "Out of stock: CheckoutError, nothing held", via: stock-shortage}
      - {id: reserved, node: place-order, after: reserve, label: The reservation comes back, via: reservation-returned}
