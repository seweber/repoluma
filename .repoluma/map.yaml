  - {id: layout-routes, from: route-lines, to: layout, type: data, label: line routes, evidence: observed}
  - {id: arrange-scores-routes, from: route-lines, to: arrange, type: data, label: routing scores of candidate arrangements, evidence: observed}
  - {id: lod-uses-layout, from: layout, to: draw-lod, type: data, label: boxes and routes, evidence: observed}
  - {id: lod-uses-camera, from: camera, to: draw-lod, type: data, label: zoom and position, evidence: observed}
  - {id: panes-placed-by-lod, from: draw-lod, to: code-panes, type: data, label: visible panes, evidence: observed}
  - {id: cache-requests-source, from: http-api, to: source-cache, type: data, label: excerpts (/api/source), evidence: observed}
