# repoluma's own map, maintained with the public schema and validator.
# Update it in the same change as the code it describes (see docs/development.md).
schema_version: 2

repository:
  name: repoluma
  description: A Python-distributed tool that turns an agent-authored, domain-first description of a repository into a zoomable map backed by live source code.

scope:
  summary: All shipped behavior of the package (CLI, map format and validation, source resolution, local server, browser viewer) and its tests. Each leaf points at the code that implements it.
  covered:
    - The authoring loop (init, guide, schema, validate)
    - Source resolution, confinement and freshness
    - The local server and its security checks
    - Layout, semantic zoom, relationship promotion, flows and code panes in the viewer
  not_covered:
    - The bundled example repository's own content (it has its own map)
    - Benchmark scripts beyond their entry points
    - CSS styling details

source:
  ownership:
    # need no place on this map: the example has its own map, benchmarks are development tools
    ignore: [src/repoluma/examples/**, bench/**]

nodes:
  # ------------------------------------------------------------------ authoring
  - id: describe
    kind: capability
    label: Map authoring
    summary: A coding agent writes the map; repoluma supplies the format, instructions and a safe first run.
    owns:
      - src/repoluma/cli.py   # commands that serve other capabilities are split off below
      - src/repoluma/__main__.py
      - src/repoluma/__init__.py
      - src/repoluma/guide/AUTHORING.md
      - src/repoluma/model.py#json_schema
    details: No model provider is embedded. The installed package prints its own guide so instructions always match the schema version.

  - id: first-run
    parent: describe
    kind: responsibility
    label: Create starter map
    summary: "`repoluma init` creates a placeholder map without overwriting anything and prints a prompt to hand to an agent."
    evidence: observed
    refs:
      - path: src/repoluma/cli.py
        symbol: cmd_init
      - path: src/repoluma/cli.py
        symbol: AGENT_PROMPT
      - path: tests/test_cli.py
        symbol: test_init_creates_placeholder_and_never_overwrites
        role: test

  - id: authoring-guide
    parent: describe
    kind: responsibility
    label: Instruct coding agents
    summary: Teaches agents to describe purpose before structure, attach evidence and report gaps; exportable as a skill file on request.
    evidence: observed
    refs:
      - path: src/repoluma/guide/AUTHORING.md
        symbol: Evidence honesty
        role: docs
      - path: src/repoluma/cli.py
        symbol: cmd_guide

  - id: map-format
    parent: describe
    kind: contract
    label: Map file format
    summary: YAML with nodes (containment tree), relationships typed as data, control or dependency (arrows always from → to), flows with failure branches, and source references.
    contract:
      inputs: [YAML document with schema_version 2 (version 1 is converted)]
      outputs: [Normalized model (JSON) consumed by the viewer]
      guarantees:
        - Ids are unique across nodes, relationships and flows
        - Containment is a tree; other links are typed relationships
        - A data relationship goes from where the data comes from to where it goes, labelled with the data
        - Unknown fields are warned about; x- prefixed fields are ignored
      assumptions: [Newer schema versions are refused with an upgrade hint]
    evidence: observed
    refs:
      - path: src/repoluma/model.py
        symbol: json_schema
        role: schema
      - path: src/repoluma/model.py
        symbol: _rel_type
      - path: tests/test_model.py
        symbol: test_json_schema_agrees_with_examples
        role: test
      - path: tests/test_model.py
        symbol: test_schema_version_1_relationships_are_converted
        role: test
      - path: src/repoluma/__init__.py

  # ----------------------------------------------------------------- validation
  - id: cli
    parent: describe
    kind: component
    label: Command-line interface
    summary: The repoluma command. Argument parsing and the entry point; the code of each subcommand is shown with the capability it serves.
    evidence: observed
    refs:
      - path: src/repoluma/cli.py
        symbol: build_parser
      - path: src/repoluma/cli.py
      - path: src/repoluma/__main__.py

  - id: validate
    kind: capability
    label: Map validation
    summary: Turns a possibly broken map into diagnostics an agent can act on, plus a best-effort model the viewer can still show.
    owns:
      - src/repoluma/model.py
      - src/repoluma/cli.py#cmd_validate

  - id: parse-map
    parent: validate
    kind: responsibility
    label: Parse map YAML
    summary: Safe YAML loading that remembers line numbers for every record; no Python objects can be constructed.
    evidence: observed
    refs:
      - path: src/repoluma/model.py
        symbol: parse_yaml
      - path: src/repoluma/model.py
        symbol: _LineLoader

  - id: check-integrity
    parent: validate
    kind: responsibility
    label: Check map structure
    summary: Required fields, id rules, references between records, containment cycles, flow step ordering.
    details: Lenient by design. Broken parents become top level and broken relationships are dropped, each with a diagnostic, so a partial map stays viewable.
    evidence: observed
    refs:
      - path: src/repoluma/model.py
        symbol: validate_document
      - path: tests/test_model.py
        symbol: test_containment_cycle_is_broken_and_reported
        role: test
      - path: src/repoluma/model.py

  - id: diagnostics
    parent: validate
    kind: contract
    label: Diagnostics with repair hints
    summary: Each problem names severity, code, record id, map line and a repair hint; available as text or JSON.
    contract:
      outputs: ["severity, code, message, location, line, record, hint"]
      guarantees: [Exit status 1 when there are errors (or warnings with --strict)]
    evidence: observed
    refs:
      - path: src/repoluma/model.py
        symbol: Diagnostic
      - path: src/repoluma/cli.py
        symbol: cmd_validate

  # ------------------------------------------------------------------- evidence
  - id: evidence
    kind: capability
    label: Code reference lookup
    summary: Finds what each reference points to in the working tree, safely, and says how sure that resolution is.
    owns:
      - src/repoluma/sources.py
      - src/repoluma/ownership.py

  - id: resolve-ref
    parent: evidence
    kind: contract
    label: Reference resolution
    summary: path + optional symbol + optional line hint becomes a line range with a status.
    contract:
      inputs: ["{path, symbol?, lines?}"]
      outputs: ["status: resolved, heuristic, lines, file, moved, ambiguous, missing_symbol, missing_file, excluded..."]
      guarantees:
        - Python symbols are matched exactly by syntax tree, never by similarity
        - An uncertain match is reported as heuristic, ambiguous or moved, never silently retargeted
      errors: [missing_file, missing_symbol, ambiguous, out_of_range, excluded, binary, too_large]
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: Repository.resolve
      - path: tests/test_sources.py
        symbol: test_python_never_resolves_to_a_different_symbol
        role: test
      - path: src/repoluma/sources.py

  - id: python-symbols
    parent: evidence
    kind: responsibility
    label: Index Python symbols
    summary: Indexes qualified names of classes, functions and module constants with ast.parse (parsing only, no import).
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: Repository._python_index

  - id: text-heuristics
    parent: evidence
    kind: responsibility
    label: Match non-Python definitions
    summary: Definition-like text patterns plus brace or indentation matching; Markdown headings; TOML tables. Disclosed as approximate.
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: _heuristic_spans
      - path: tests/test_sources.py
        symbol: test_heuristics_for_other_languages
        role: test

  - id: confinement
    parent: evidence
    kind: rule
    label: Repository files only
    summary: Only regular files inside the root after symlink resolution, never excluded files (secrets, VCS, caches), never binary or huge files.
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: Repository.safe_path
      - path: src/repoluma/sources.py
        symbol: DEFAULT_EXCLUDES
      - path: tests/test_sources.py
        symbol: test_symlink_escaping_root_is_refused
        role: test

  - id: freshness
    parent: evidence
    kind: responsibility
    label: Report changes since review
    summary: Reports HEAD, uncommitted files, and which referenced files changed since the map's reviewed revision.
    details: Git runs read-only with hooks and fsmonitor disabled, so viewing a repository cannot execute its configuration.
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: git_state
      - path: src/repoluma/sources.py
        symbol: _git
      - path: tests/test_freshness.py
        symbol: test_git_config_cannot_run_commands
        role: test

  - id: coverage
    parent: evidence
    kind: responsibility
    label: Count unmapped files
    summary: Per-directory counts of code files that have an owner, an honest signal of unmapped areas.
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: coverage

  - id: ownership
    parent: evidence
    kind: responsibility
    label: Assign files to areas
    summary: Gives every code file exactly one owning area from the top-level nodes' owns patterns, decides which pane shows each line, and reports files without an owner.
    details: The most specific pattern wins (an exact path beats a glob); path#Symbol gives part of a file to another area. Every line of code must be shown by a node of its area (glue such as imports and comments excepted); code no node shows is an error and is flagged in the viewer. Tests, docs and tooling need no owner.
    evidence: observed
    refs:
      - path: src/repoluma/ownership.py
        symbol: compute_ownership
      - path: src/repoluma/ownership.py
        symbol: specificity
      - path: src/repoluma/ownership.py
        symbol: rest_of_files
      - path: tests/test_ownership.py
        symbol: test_the_most_specific_pattern_wins
        role: test
      - path: src/repoluma/ownership.py

  - id: working-tree
    parent: evidence
    kind: resource
    label: Working tree files
    summary: The repository's files as they are now, including uncommitted edits. The single source of displayed code.
    evidence: observed
    refs:
      - path: src/repoluma/sources.py
        symbol: Repository.read

  # --------------------------------------------------------------------- server
  - id: serve
    kind: capability
    label: Local map server
    summary: A standard-library HTTP server on loopback that hands the browser the analyzed map and bounded source excerpts.
    owns:
      - src/repoluma/workspace.py
      - src/repoluma/server.py
      - src/repoluma/cli.py#cmd_serve

  - id: analysis
    parent: serve
    kind: responsibility
    label: Assemble map analysis
    summary: Validates the map, resolves every reference once, and gathers git and coverage context into one payload.
    evidence: observed
    refs:
      - path: src/repoluma/workspace.py
        symbol: Workspace.analyze
      - path: src/repoluma/workspace.py

  - id: http-api
    parent: serve
    kind: contract
    label: Viewer HTTP API
    summary: GET /api/bootstrap, /api/status, /api/source; static assets; everything else refused.
    contract:
      inputs:
        - "X-Repoluma-Token header (from the served page)"
        - "/api/source?path&start&end for a file the map references or owns"
      outputs:
        - bootstrap = model, diagnostics, ref resolutions, file owners, git, coverage
        - status = digest of map and referenced-file stats, and of the file list
        - source = bounded line excerpt with a change token
      guarantees: [Read-only, at most 2000 lines per excerpt]
      errors: [403 wrong Host, Origin or token; 405 non-GET; error field for unservable files]
    evidence: observed
    refs:
      - path: src/repoluma/server.py
        symbol: make_handler
      - path: tests/test_server.py
        symbol: test_source_endpoint_serves_only_referenced_or_owned_files
        role: test
      - path: src/repoluma/server.py
      - path: src/repoluma/cli.py
        symbol: cmd_serve

  - id: request-guard
    parent: serve
    kind: rule
    label: Loopback and token only
    summary: Loopback by default, Host allow-list against DNS rebinding, per-process token, cross-origin refusal, strict CSP.
    evidence: observed
    refs:
      - path: src/repoluma/server.py
        symbol: create_server
      - path: tests/test_server.py
        symbol: test_dns_rebinding_host_refused
        role: test

  - id: change-detection
    parent: serve
    kind: responsibility
    label: Reanalyze on file changes
    summary: Caches the analysis and recomputes it when the map or a referenced file changes (stat tokens), so polling is cheap.
    evidence: observed
    refs:
      - path: src/repoluma/server.py
        symbol: ViewerState

  # --------------------------------------------------------------------- viewer
  - id: navigate
    kind: capability
    label: Zoomable map
    summary: One zoomable map in the browser; detail appears as things get larger, consistently everywhere.
    owns:
      - src/repoluma/web/   # the page, styles, app shell (main.js) and shared helpers (util.js)
      - src/repoluma/model.py#_link_steps

  - id: layout
    parent: navigate
    kind: responsibility
    label: Size and nest regions
    summary: Sizes regions bottom-up and places them top-down at a constant scale step, so every node at the same depth has the same on-screen size at any zoom.
    details: Geometry depends only on the map, never on zoom, filters or selection, so the map does not rearrange while navigating.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/layout.js
        symbol: computeLayout
      - path: src/repoluma/web/js/layout.js

  - id: arrange
    parent: navigate
    kind: responsibility
    label: Place connected items together
    summary: Places the items of each region so connected items sit close and items talking to other regions sit on the side facing them.
    details: Stress majorization gives neutral positions, an optimal assignment snaps them to a grid, and local swaps shorten routes and avoid bends. Maps up to 1,500 nodes try several variants per region and keep the one that routes best. Last, an item smaller than its grid cell moves within it to where its lines run straight.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/arrange.js
        symbol: arrange
      - path: src/repoluma/web/js/arrange.js
        symbol: stress
      - path: src/repoluma/web/js/layout.js
        symbol: bestArrangement
      - path: src/repoluma/web/js/arrange.js

  - id: constant-scale
    parent: navigate
    kind: rule
    label: Equal size at equal depth
    summary: The child scale step K is global; panning at a fixed zoom shows comparable detail in every region.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/layout.js
        symbol: K
      - path: src/repoluma/web/js/layout.js
        symbol: PANE_K

  - id: camera
    parent: navigate
    kind: component
    label: Zoom and pan camera
    summary: Pointer-anchored zoom, panning, and smooth fly-to (van Wijk and Nuij) that zooms out before travelling far.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/camera.js
        symbol: Camera.flyTo
      - path: src/repoluma/web/js/camera.js
        symbol: interpolateZoom
      - path: src/repoluma/web/js/camera.js

  - id: draw-lod
    parent: navigate
    kind: responsibility
    label: Draw detail by zoom level
    summary: Draws only what is in view; text becomes readable, greeked, or an overview label depending on its projected size.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/render.js
        symbol: Renderer.drawNode
      - path: src/repoluma/web/js/render.js

  - id: route-lines
    parent: navigate
    kind: responsibility
    label: Route connection lines
    summary: Connects boxes with horizontal and vertical lines that avoid everything drawn, deciding the inside of nested regions before where a line crosses their borders.
    details: A line may touch a box anywhere along a side. For each end, the ways out of every enclosing region are computed from the inside out (straight and L-shaped ways keep a range of border positions, split and priced by the placed lines they would cross), and the region containing both ends picks the cheapest combination of a straight, L or Z line. Spots on box sides and borders are claimed so lines keep their spacing; finally, parallel pieces that run alongside each other are ordered by where they turn off and moved apart as little as needed. Only connections with identical endpoints share a line; flows add no lines of their own.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/route.js
        symbol: routeNets
      - path: src/repoluma/web/js/route.js
        symbol: Level.connect
      - path: src/repoluma/web/js/route.js
        symbol: Level.exitRanges
      - path: src/repoluma/web/js/route.js
        symbol: Level.separate
      - path: src/repoluma/web/js/render.js
        symbol: Renderer.drawSegments
      - path: src/repoluma/web/js/route.js

  - id: flow-overlay
    parent: navigate
    kind: responsibility
    label: Show flow steps
    summary: Shows a flow's numbered steps on the relationships they use, with dashed failure and compensation branches, and a step bar on the map to go back, forward or close.
    details: The validator resolves which relationship each step is drawn on (its `via`, or one from where the flow is to this step's node) and warns when there is none, so a flow never shows a connection the map does not have. It also warns when a step jumps over nodes the flow passes through, since only the steps' nodes and the ends of their relationships stay bright.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/render.js
        symbol: Renderer.drawFlow
      - path: src/repoluma/web/js/ui.js
        symbol: renderFlowBar
      - path: src/repoluma/web/js/main.js
        symbol: App.setFlow
      - path: src/repoluma/model.py
        symbol: _link_steps

  - id: panels
    parent: navigate
    kind: component
    label: Inspector and side panels
    summary: Outline (keyboard-accessible tree), flows, layers, coverage, and an inspector with contract, evidence and relationships.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/ui.js
        symbol: renderInspector
      - path: src/repoluma/web/js/ui.js
        symbol: renderCoverage
      - path: src/repoluma/web/js/ui.js

  - id: filters
    parent: navigate
    kind: responsibility
    label: "Filter lines, kinds and tags"
    summary: Hide relationship types (data, control, dependency), node kinds or tags; hidden nodes keep their place as outlines and hidden counts stay visible. A legend on the map says what each line type and arrow means.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/main.js
        symbol: App.recomputeHidden
      - path: src/repoluma/web/js/main.js
        symbol: App.updateStatusBar
      - path: src/repoluma/web/js/ui.js
        symbol: renderMapLegend

  # ---------------------------------------------------------------- source panes
  - id: app-shell
    parent: navigate
    kind: component
    label: Viewer state and input
    summary: Loads the analysis, holds the selection, view, filters and URL state, and handles input, search and live refresh.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/main.js

  - id: page-and-styles
    parent: navigate
    kind: component
    label: Viewer page and styles
    summary: The single HTML page (panels, controls, help) and its stylesheet with light and dark themes.
    evidence: observed
    refs:
      - path: src/repoluma/web/index.html
      - path: src/repoluma/web/app.css

  - id: shared-helpers
    parent: navigate
    kind: component
    label: DOM and math helpers
    summary: Small DOM and math helpers used across the viewer; map and source text reaches the DOM only as text.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/util.js

  - id: inspect-source
    kind: capability
    label: Code in the map
    summary: Referenced code appears inside its node as a bounded, scrollable, selectable pane read live from the server.
    owns:
      - src/repoluma/web/js/panes.js
      - src/repoluma/web/js/highlight.js
      - src/repoluma/web/js/files.js
      - src/repoluma/cli.py#cmd_where

  - id: code-panes
    parent: inspect-source
    kind: component
    label: Source code panes
    summary: DOM panes positioned with the camera transform once their text is large enough; inactive panes forward wheel and drag to the map.
    details: Click activates a pane (wheel scrolls code, text is selectable); Esc releases it. Context lines can be expanded.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/panes.js
        symbol: PaneLayer.update
      - path: src/repoluma/web/js/main.js
        symbol: App.bindEvents
      - path: src/repoluma/web/js/panes.js

  - id: source-cache
    parent: inspect-source
    kind: component
    label: Code excerpt loader
    summary: Fetches visible excerpts with bounded concurrency, drops requests that scrolled out of view, invalidates changed files.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/panes.js
        symbol: SourceCache

  - id: highlight
    parent: inspect-source
    kind: component
    label: Syntax highlighter
    summary: Approximate line tokenizer that only produces text nodes.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/highlight.js
        symbol: tokenize
      - path: src/repoluma/web/js/highlight.js

  # ------------------------------------------------------------------ discussing
  - id: file-lookup
    parent: inspect-source
    kind: responsibility
    label: Locate a file's area
    summary: From a file (or line) to its area and the pane that shows it, and who cites it, in the Files tab, the file view and `repoluma where`.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/files.js
        symbol: FileIndex.ownerAt
      - path: src/repoluma/web/js/ui.js
        symbol: renderFiles
      - path: src/repoluma/cli.py
        symbol: cmd_where
      - path: src/repoluma/web/js/files.js

  - id: discuss
    kind: capability
    label: Agent handoff
    summary: Stable ids, links that restore the exact view, and copyable selection summaries make it easy to point an agent at a region.
    owns:
      - src/repoluma/web/js/main.js#App.agentSummary
      - src/repoluma/web/js/main.js#App.restoreFromHash
      - src/repoluma/web/js/ui.js#computeImpact

  - id: agent-summary
    parent: discuss
    kind: responsibility
    label: Copy summary for agent
    summary: Text with ids, containment path, contract, resolved source ranges, relationships, review candidates and a view link.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/main.js
        symbol: App.agentSummary

  - id: view-links
    parent: discuss
    kind: responsibility
    label: Link to exact view
    summary: The URL fragment carries camera, selection, active flow step and filters.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/main.js
        symbol: App.restoreFromHash

  - id: impact
    parent: discuss
    kind: responsibility
    label: Trace change impact
    summary: Walks modeled dependency relationships backwards up to three steps and shows the path, with a coverage disclaimer.
    evidence: observed
    refs:
      - path: src/repoluma/web/js/ui.js
        symbol: computeImpact

  - id: change-overlay
    parent: discuss
    kind: responsibility
    label: Sketch proposed changes
    summary: Sketching a proposed change on top of the current map, kept visibly separate from implemented behavior.
    evidence: planned

  # -------------------------------------------------------------------- outside
  - id: coding-agent
    kind: actor
    label: Coding agent
    summary: Reads the guide and the repository, writes and repairs the map, runs validate.

  - id: developer
    kind: actor
    label: Developer
    summary: Explores the map in the browser and discusses regions with the agent.

  - id: map-file
    kind: resource
    label: Map file
    summary: .repoluma/map.yaml in the viewed repository, tracked in version control.
    evidence: observed
    refs:
      - path: src/repoluma/__init__.py
        symbol: DEFAULT_MAP_PATH

relationships:
  # data: from = where the data comes from, to = where it goes; label = the data
  - {id: agent-reads-guide, from: authoring-guide, to: coding-agent, type: data, label: authoring instructions}
  - {id: agent-writes-map, from: coding-agent, to: map-file, type: data, label: map YAML}
  - {id: agent-runs-validate, from: diagnostics, to: coding-agent, type: data, label: errors with repair hints}
  - {id: init-writes-map, from: first-run, to: map-file, type: data, label: placeholder map (only if missing), evidence: observed}
  - {id: parse-reads-map, from: map-file, to: parse-map, type: data, label: map YAML, evidence: observed}
  - {id: integrity-after-parse, from: parse-map, to: check-integrity, type: data, label: document with line numbers, evidence: observed}
  - {id: integrity-reports, from: check-integrity, to: diagnostics, type: data, label: errors and warnings, evidence: observed}
  - {id: analysis-validates, from: check-integrity, to: analysis, type: data, label: normalized model, evidence: observed}
  - {id: resolve-reads-tree, from: working-tree, to: resolve-ref, type: data, label: file contents, evidence: observed}
  - {id: resolve-python, from: python-symbols, to: resolve-ref, type: data, label: symbol line ranges (.py), evidence: observed}
  - {id: resolve-heuristic, from: text-heuristics, to: resolve-ref, type: data, label: line ranges by text pattern, evidence: observed}
  - {id: analysis-resolves, from: resolve-ref, to: analysis, type: data, label: resolution of every ref, evidence: observed}
  - {id: freshness-reads-tree, from: working-tree, to: freshness, type: data, label: git status and diff, evidence: observed}
  - {id: analysis-freshness, from: freshness, to: analysis, type: data, label: files changed since review, evidence: observed}
  - {id: analysis-coverage, from: coverage, to: analysis, type: data, label: coverage per directory, evidence: observed}
  - {id: ownership-lists-files, from: working-tree, to: ownership, type: data, label: file list, evidence: observed}
  - {id: analysis-ownership, from: ownership, to: analysis, type: data, label: owner of every file, evidence: observed}
  - {id: lookup-uses-api, from: http-api, to: file-lookup, type: data, label: owners and whole files, evidence: observed}
  - {id: validate-command-analyzes, from: analysis, to: diagnostics, type: data, label: diagnostics (same analysis as the viewer), evidence: observed}
  - {id: api-serves-analysis, from: analysis, to: http-api, type: data, label: "model, resolutions, diagnostics", evidence: observed}
  - {id: api-uses-analysis, from: change-detection, to: http-api, type: data, label: status digest, evidence: observed}
  - {id: shell-loads, from: http-api, to: app-shell, type: data, label: analysis and status digest, evidence: observed}
  - {id: layout-consumes-api, from: http-api, to: layout, type: data, label: bootstrap (model and resolutions), evidence: observed}
