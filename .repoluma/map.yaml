flows:
  - id: flow-authoring-loop
    label: Author a map with an agent
    summary: From an unmapped repository to a validated map.
    certainty: observed
    steps:
      - {id: init, node: first-run, label: Developer runs init and copies the prompt}
      - {id: guide, node: authoring-guide, label: Agent reads the guide that matches the installed version, via: agent-reads-guide}
      - {id: write, node: map-file, label: "Agent writes nodes, relationships, flows and refs", via: agent-writes-map}
      - {id: parse, node: parse-map, label: validate parses the YAML safely and keeps line numbers, via: parse-reads-map}
      - {id: validate, node: check-integrity, label: Integrity is checked against the format, via: integrity-after-parse}
      - {id: analyze, node: analysis, label: The normalized model goes into the analysis, via: analysis-validates}
      - {id: resolve, node: resolve-ref, label: Every ref is resolved against the working tree, via: analysis-resolves}
      - {id: errors, node: diagnostics, kind: failure, after: resolve, label: "Errors: agent repairs using hints and re-runs", via: agent-runs-validate}
      - {id: done, node: analysis, label: Clean result; the viewer can open it}

  - id: flow-open-and-zoom
    label: Open the map and zoom to code
    summary: What happens between `repoluma serve` and readable source inside the map.
    certainty: observed
    steps:
      - {id: serve, node: request-guard, label: serve binds loopback and creates the page token}
      - {id: bootstrap, node: http-api, label: Page requests /api/bootstrap with the token}
      - {id: analyze, node: analysis, label: Map validated and refs resolved once, via: api-serves-analysis}
      - {id: layout, node: layout, label: Browser computes the nested layout, via: layout-consumes-api}
      - {id: zoom, node: camera, label: Wheel zooms around the pointer, via: developer-explores}
      - {id: lod, node: draw-lod, label: Details become readable as boxes grow, via: lod-uses-camera}
      - {id: pane, node: code-panes, label: Code panes turn into real text, via: panes-placed-by-lod}
      - {id: fetch, node: source-cache, label: Visible excerpts are fetched, via: panes-fetch}
      - {id: source, node: http-api, label: Served by /api/source, via: cache-requests-source}
      - {id: refused, node: confinement, kind: failure, after: source, label: "Unreferenced, excluded or escaping paths are refused", via: api-source-confined}

  - id: flow-refresh
    label: Refresh after a source change
    summary: Editing a referenced file or the map updates the open page without a restart.
    certainty: observed
    steps:
      - {id: poll, node: http-api, label: Page polls /api/status every 1.5 s}
      - {id: detect, node: change-detection, label: Stat tokens of the map and referenced files changed}
      - {id: reanalyze, node: analysis, label: Map re-validated and refs re-resolved, via: change-detection-reanalyzes}
      - {id: missing, node: diagnostics, kind: failure, after: reanalyze, label: "Symbol renamed: shown as missing, never retargeted"}
      - {id: serve, node: http-api, label: The page receives the new model and resolutions, via: api-serves-analysis}
      - {id: relayout, node: layout, label: Layout rebuilt; camera anchored on the selection, via: layout-consumes-api}
      - {id: refetch, node: source-cache, label: Excerpts of changed files invalidated and refetched, via: cache-requests-source}
