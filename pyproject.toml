[project]
name = "repoluma"
version = "0.1.0"
description = "A domain-first, zoomable map of a codebase, authored by your coding agent and backed by real source."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["architecture", "visualization", "code-map", "semantic-zoom", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
repoluma = "repoluma.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "playwright==1.63.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoluma"]

[tool.hatch.build.targets.sdist]
include = ["src/repoluma", "tests", "examples", "README.md", "docs", ".repoluma/map.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
